# cyrene-agent — bundle 补丁
#
# 只做一件事：把宿主半体挂进 loader，让 `dsh plugin --profile <name> add cyrene-agent`
# 之后 DSH 能加载到这个包。**它刻意保持纯 insert(id/name) 形式**，这是可热挂载的。
#
# 不要在这里写任何机器相关的路径：patch 里的硬编码路径在别人机器上必然指向不存在的
# 目录，插件会直接起不来。
#
# 预设**不在这里注册**。本机 DSH 的预设注册表不扫描目录、也不接受 preset 路径
# （官方契约：定义使用普通插件行）。预设行在 cyrene-agent/dist/cordis.patch.yml 里，
# 由 build.mjs 生成后追加到 profile 补丁的顶层数组。
- insert:
    - id: cyrene-agent
      # ⚠️ 2026-10-12：加了 `@<用户名>/` 作用域 —— **因为 `cyrene-agent` 这个名字
      # 在 npm 上已经被别人占了（1.2.1）**，而 patch 里的 `name` 是**包的去处**，
      # 必须和 registry 上的名字一致，否则装不上。
      #
      # 而上面那个 `id` **不动**：它是 loader 里的标识，不是 npm 名。
      # 改它会牵动 profile 里已经写下的挂载记录。
      name: '@<用户名>/cyrene-agent'
