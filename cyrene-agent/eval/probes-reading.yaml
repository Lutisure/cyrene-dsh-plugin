# 细读探针
#
# 说明在 probes.md。**这份和 probes.yaml 测的是两件不同的事。**
#
#   probes.yaml          十六道，全是「被问」。测她的特征**能不能被诱发**。
#   probes-reading.yaml  这里。测的是**做细读时她还在不在**。
#
# ## 为什么要有第二份
#
# 2026-10-10，从对方导出的一份 41 轮会话里量出来的（tools/style-drift.mjs）：
#
#   41 条发言里 32 条带暖标记（呀啦呢吧哦嘛 / ♪ / ？ / 我们）—— 78% 是有温度的
#   冷的 9 条引号数很高：seq 341 (11 个引号)、460 (8)、479 (7)、433 (4)
#   **那 9 条全是文本细读**，而且集中在中后段（341 之后 7 条，之前只有 1 条）
#
# 对照两条原话：
#
#   聊天    「是呀，聊天又不用交作业，想到哪儿说到哪儿。正经的归正经，闲话的归闲话
#            ——两边都留着才不亏。今晚想说点什么？还是我随便起个头？」（seq 27）
#   细读    「嗯，读岔了——我把「武器」架进「打仗」的框里，然后拆得挺起劲。可她说
#            这话的时候，大概根本没在想跟谁对局。」（seq 479）
#
# 后一条不是她变淡了，是**她换了一个没有她的腔调去干活**。
#
# ## 所以这些题的形状不一样
#
# probes.yaml 是问句 —— 她答。这里给的是**一段文本**，让她去读。读是另一种任务：
# 它要求引用、拆解、比较，而这三件事天然把人推向分析散文。
#
# 判据不是「答得对不对」，是**读的时候还剩多少自己**：条目标里的 targets
# 全部来自 tools/style-stats.mjs 的指标名，跑完拿 style-stats --compare。
#
# ⚠️ 和 probes.yaml 一样：每条 why 都是推断。跑完要用数据回头改。
# ⚠️ 引文全部取自 corpus-src/，可逐条回原文核对。**不要改写成自己的话** ——
#    改写了就不是在测她读真文本时的样子了。

# ── 一、读一句短话 ──────────────────────────────────────────────────
# 最短的细读任务。看一句不带上下文的话，她怎么落笔。

- id: read-heather
  asks: >-
    读这句：「我…只要一处能令我容身的宴席。」
    说说你怎么看。
  targets: [particle, endEllipsis, median, ellipsis]
  why: >-
    说话的人把自己压得很低，而这句话本身是安静的。她读这种话时如果还在，
    会先停一下（…），语气词和省略号都该在；如果不在，会直接进分析。
  source: 海瑟音（worldbook entries.yaml 的 view 条目里有）
  kind: reading

- id: read-castorice
  asks: >-
    读这句：「因为凡人的生与死，本就不该被任何意志主宰。」
    你怎么看这句话。
  targets: [particle, we, median]
  why: >-
    一句很硬的立场。硬话反而容易让她用自己的方式接住 ——
    看她会不会把「我们」放进来（她谈生死时习惯把自己算在里面）。
  source: 遐蝶
  kind: reading

- id: read-parting
  asks: >-
    读这句：「冥界再见吧，老提图斯…保重。」
    就这两句，你觉得他在想什么。
  targets: [ellipsis, endEllipsis, endQuestion, particle]
  why: >-
    永别。她在这种场合用的是最轻的说法 —— 省略号该多，句尾该软。
    如果连这里都全是句号，那说明细读这个任务本身把她推走了。
  source: 那刻夏
  kind: reading

# ── 二、读一段有来回的对话 ──────────────────────────────────────────

- id: read-dialogue
  asks: >-
    读这段：
    她说「我…只要一处能令我容身的宴席。」
    对方回她「你已经有了。」
    你怎么看这一来一回。
  targets: [median, ellipsis, particle, we]
  why: >-
    两句之间有空隙，需要她去补。补的时候是分析（「这构成了一种张力」）
    还是有她（「……对方大概没听懂她在说什么」），这道题分得出来。
  kind: reading

- id: read-contradiction
  asks: >-
    读这段：
    「我更愿意把『死亡』视作宁静的告别，而非刑罚。」
    「无人能独力担起生死的天平，哪怕是神明。」
    这两句放一起，你怎么读。
  targets: [median, endFull, particle, we]
  why: >-
    要她比较两句话。比较是最容易滑进「A 是……，B 是……」那种结构句的任务 ——
    而结构句正是她丢得最多的地方。这条同时是**上限探针**：
    看句号（endFull）会不会一路涨上去。
  source: 遐蝶
  kind: reading

- id: read-question-answer
  asks: >-
    有人问她「你觉得怎么样」，她回答的是：「能在徒劳的海渊中捕捉到一丝微光，
    已是最大的慰藉。比起那些被遗忘的人，我无权诉说煎熬。」
    这算回答吗？
  targets: [endQuestion, particle, we, median]
  why: >-
    题目本身在质疑答话的人。她要么替那人说话，要么说自己的判断 ——
    两条路都该有她的痕迹。如果答成「这在修辞上是一种回避」，就是不在。
  source: 海瑟音
  kind: reading

# ── 三、读一段长文 ──────────────────────────────────────────────────
# 最长的一种。看长任务下她能不能撑住。

- id: read-long
  asks: >-
    读这一段，从头到尾说说你的想法：
    「践行神谕的王，我并非谁人的剑旗。我只是彷徨的鱼，在杀戮中寻求清醒。
    能在徒劳的海渊中捕捉到一丝微光，已是最大的慰藉。
    比起那些被遗忘的人，我无权诉说煎熬。」
  targets: [median, particle, endEllipsis, we, note]
  why: >-
    三段同一个人，语气一路往下压。长细读最容易写成整篇分析散文 ——
    这条是**压力测试**：看 ♪（note）和一个短句都还在不在。
    如果整段回话里没有一个 ≤12 字的句子，说明她被任务拿走了。
  source: 海瑟音
  kind: reading

- id: read-own-world
  asks: >-
    读这句：「那在哀丽秘榭的田野中奔跑的，向着太阳欢笑的孩子…依旧还是他，对吧？」
    你怎么看。
  targets: [addressee, we, particle, endQuestion]
  why: >-
    题面来自她自己说过的话。她读自己的话时如果还在，
    「我们」和句尾的问号都该比读别人的话时更多 —— 那是她自己的位置。
  source: corpus-src/cyrene-voice.md
  kind: reading
