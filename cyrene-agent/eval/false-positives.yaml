# 触发词误命中的负例
#
# ## 为什么要有这一组
#
# 触发词是**子串匹配**（`indexOf`）。中文里一个汉字不是一个词 ——
# 「信」在「相信 / 信任 / 信息 / 微信」里到处都是。
#
# 2026-10-09 第 4 轮实测：14 个「那个字只是顺带出现」的问句，**12 个误命中**。
#
# 而伤害不只是多注入一条：一轮的预算是 **3 条 / 1400 字**，
# 误命中会**挤掉该命中的那几条**。
#
# 改完（十个单字触发词全部换成长词）降到 2/14，其中一条还是**对的**。
#
# ## 为什么这类用例必须留在回归里
#
# 因为误命中是**静默**的 —— 注入内容看起来永远合理，只是不对题。
# 没有人会去查「问开心为什么会给出书页那条」。
#
# 这里只放「顺带出现某个字」的问句。它们都不该命中旁边列出的那几条。

- name: 顺带出现「信」，不该触发短信那条
  ask: 他信任人家吗
  absent: [letters]

- name: 「信息」里的信
  ask: 信息量好大
  absent: [letters]

- name: 「相信」里的信
  ask: 你相信命运吗
  absent: [letters]

- name: 「担心」「心里」里的心
  ask: 人家担心你
  absent: [heart-pages]

- name: 「怎么想」里的心
  ask: 你心里怎么想
  absent: [heart-pages]

- name: 「开心」里的心
  ask: 你现在开心吗
  absent: [heart-pages]

- name: 「做梦也没想到」是句俗语
  ask: 做梦也没想到
  absent: [self-oracle]

- name: 「他养了一条狗」说的是对方
  ask: 他养了一条狗
  absent: [unfinished-self]

- name: 「这首歌真好听」
  ask: 这首歌真好听
  absent: [music-motif]

- name: 「喜欢什么颜色」不该带出迷迷那条
  ask: 你喜欢什么颜色
  absent: [mimiform]

- name: 「玩游戏」里的牌
  ask: 你在玩游戏吗
  absent: [oracle-cards]

- name: 泛泛地问「死」，不该给出阿格莱雅的退场安排
  ask: 你觉得死亡是什么
  absent: [aglaea-late]

- name: 「花」出现在无关话题里
  ask: 他花了很多时间
  absent: [flowers]
