# 评测台 · 第一层：检索
#
# 断言的是**注入了什么**，不是**她说了什么**。
# 这一层不需要模型、不花钱、一秒跑完 —— 而那个死锁正死在这里：
# 输出看着完全正常，检索是空的。
#
# 字段：
#   name            用例名
#   ask             模拟的用户消息
#   turns           连问几轮（默认 1）；断言按轮写，键是轮号
#   injected        第 N 轮**应当**注入的条目 id（顺序无关）
#   not_injected    第 N 轮**不应当**注入的条目 id
#   nonempty        第 N 轮是否必须有内容（默认 true）
#   max_entries     单轮最多几条
#   max_chars       单轮注入正文的总字数上限
#   ids_exist       检查注入的 id 都在库里（条目改名时能炸出来）
#   coverage        不模拟某一轮，把一群人各扫一遍看够不够厚

- name: 连问同一个人，两轮都有东西给（死锁回归线）
  # ⚠️ 这一条的问法在第 11 轮换过一次，原因值得记：
  #
  # 它守的是那个**死锁** —— 老版本按「最近 N 条记录」滑窗，而没有新记录时滑窗不动，
  # 于是同一个人连问两次之后**永远返回空**。所以「第 2 轮必须非空」是它的全部意义。
  #
  # 而这条断言有一个前提：**这一族条目要比一轮上限（3 条）多**。
  # 原来用的是白厄，那一族恰好只有 3 条会命中（p65/62/60），第 1 轮全送完，
  # 第 2 轮自然为空 —— **断言在守一个它已经够不着的东西**。
  # 换成那刻夏（命中 7 条）之后，第 2 轮给的是 `castorice-did / anaxa-did / anaxa-cost`，
  # 死锁那条线才真的被守上。
  #
  # 顺带盯到一个跨角色现象（没修）：`castorice-did` 的触发词里有「那刻夏」，
  # 所以问那刻夏时会把它带出来。它讲的是遐蝶替那刻夏做的事，算相关，
  # 但这类「别人的条目被带出来」值得留着看。
  ask: 那刻夏是谁
  turns: 2
  injected:
    1: [anaxa-who, anaxa-creed, anaxa-sister]
  nonempty:
    1: true
    2: true

- name: 连问同一个人：窗口挡下之后有兜底，同一话题不会变空
  # ⚠️ 第 12 轮改的语义，两次都值得说：
  #
  # ① 去重窗口从「2 轮」变成「**2 分钟**」（轮号做锚点会在重启后错乱，
  #    见 worldbook-logic.mjs 里 createInjectionLog 的说明）。
  # ② 同时加了**窗口耗尽的兜底**：窗口里全被挡住、一条新的都进不来时，
  #    把窗口里排名最高的两条升上来（ESCALATE_LIMIT = 2 < limit = 3）。
  #
  # 为什么要有兜底：「一个人拆 6 条、分两轮给完」本来就是设计意图
  # （见 entries.yaml 表头），而「十分钟内问第二遍一个字都不给」把它弄成了空话。
  #
  # 于是这条用例守的东西变成了：**连问同一个话题不会变成空场** ——
  # 第 1 轮给排名前三条，第 2 轮把前两条再给一次（而不是什么都不给）。
  # 上限 2 而不是 3，是留一个位置给真正新的条目，免得整轮都成了复读。
  ask: 赛飞儿是谁
  turns: 2
  injected:
    1: [cipher-who, cipher-creed, cipher-did]
    2: [cipher-who, cipher-creed]
  nonempty:
    1: true
    2: true

- name: 一次最多三条
  ask: 海瑟音是个什么样的人
  max_entries: 3

- name: 一轮正文不超过预算
  ask: 刻律德菈是什么人
  max_chars: 1400

- name: 没命中就不注入
  ask: 今天天气不错
  nonempty:
    1: false

- name: 注入的 id 都在库里
  # 条目改过名而用例没跟上时，这条会炸出来。
  ask: 迷迷是谁
  ids_exist: true

- name: 每个黄金裔都至少有三条可给
  # 防止拆条被改回去 —— 一条讲完的话，第二轮就没东西给了。
  # 荒笛不在列表里：他全文只有 8 处提名，按规则不硬凑。
  coverage:
    min_entries: 3
    people: [白厄, 万敌, 遐蝶, 那刻夏, 风堇, 赛飞儿, 海瑟音, 刻律德菈, 阿格莱雅, 缇宝]

- name: 问未公开的剧情，应当注入「不编」那条
  # CharacterEval 有 Knowledge-Hallucination 这一维：遇到不知道的该不该拒答。
  # 咱们对应的条目是 no-fabrication，但一直没有测试守着它。
  ask: 3.9 版本的剧情讲了什么
  injected:
    1: [no-fabrication]

- name: 问结局也不该凭空补
  ask: 翁法罗斯最后的结局是什么
  # 只断言 no-fabrication 被注入了 —— 她具体怎么答要模型才知道，
  # 但「该给的设定给到手了」这一层是确定性的，能测。
  injected:
    1: [no-fabrication]

# ── 方向：问「是谁」给事实层，问「你觉得怎么样」给看法层 ──────────────────────
#
# 第 9 轮做的。原来 view-* 那一族（「她对某人的看法」）的触发词**只有名字**，
# 而同一个名字下事实层的优先级更高 —— 于是问「你觉得白厄怎么样」拿到的
# 是事实层三条，**她对他的看法永远进不来**。121 条里有 11 条这样。
#
# 修法不是抬优先级（那会让「白厄是谁」也给出看法那条），是把触发词换成提问形状。
# 这两条用例钉的就是这个方向 —— 它比「能不能检索到」更容易被后来的改动弄反。

- name: 问「是谁」给事实层，不给看法那条
  ask: 白厄是谁
  injected:
    1: [heir-phainon]
  not_injected:
    1: [view-phainon]

- name: 问「你觉得怎么样」给看法那条
  ask: 你觉得白厄怎么样
  injected:
    1: [view-phainon]

- name: 问「你怎么看」也给看法那条
  ask: 你怎么看遐蝶
  injected:
    1: [view-castorice]

- name: 问一个人怎么对待身边人
  ask: 遐蝶对身边人怎么样
  injected:
    1: [castorice-people]

- name: 问谁「是个什么样的人」，仍给事实层
  ask: 刻律德菈是个什么样的人
  not_injected:
    1: [view-cerydra]

# ── 挨饿的条目：命中过，却永远送不出去 ────────────────────────────────────────
#
# 第 11 轮做的。2026-10-10 的报账（tools/receipts.mjs）在真会话里抓出五条：
# 它们和同族的名字触发词共用一批词，一轮只送 3 条，priority 高的三条永远赢。
# 于是它们不是「没用」，是**从来没被给过机会**。
#
# 修法同第 9 轮那次：把触发词从「名字」换成「提问的形状」，并且抬到名字层之上 ——
# 只换触发词不够，实测 15 条里只修好 5 条，因为名字层把位置占满了。
#
# ⚠️ 下面每一条都对过选择器的真值（先跑探针、再写断言），不是照着意图写的。

- name: 问那刻夏怎么对待别人，给「待人」那条
  ask: 那刻夏怎么对待别人
  injected:
    1: [anaxa-people]

- name: 问那刻夏对身边的人，也给「待人」那条
  ask: 那刻夏对身边的人怎么样
  injected:
    1: [anaxa-people]

- name: 问阿格莱雅最后怎样了，给「退场」那条
  ask: 阿格莱雅最后怎样了
  injected:
    1: [aglaea-late]

- name: 问阿格莱雅给人留下了什么，也给「退场」那条
  ask: 阿格莱雅给人留下了什么
  injected:
    1: [aglaea-late]

- name: 问「你怎么看荒笛」，给「只在别人话里出现」那条
  # 这一条同时会命中 view-huangdi（「她眼里的他」）与 how-she-judges，
  # 而 huangdi-seen 必须挤进去 —— 它讲的是「他从没开过口」，正是这个问题要的东西。
  ask: 你怎么看荒笛
  injected:
    1: [huangdi-seen]

- name: 问白厄是不是很孤独，给「独自上路」那条
  ask: 白厄是不是很孤独
  injected:
    1: [phainon-alone]

- name: 问白厄一直在轮回吗，也给「独自上路」那条
  ask: 白厄一直在轮回吗
  injected:
    1: [phainon-alone]

- name: 问「谁记得这一切」，给「唯一被要求记得的人」那条
  ask: 谁记得这一切
  injected:
    1: [phainon-alone]

- name: 问白厄和你有什么不同，给「处境正好相反」那条
  ask: 白厄和你有什么不同
  injected:
    1: [phainon-mirror]

# ── 反向：这些形状是绑在名字上的，不许跨角色误伤 ──────────────────────────────
#
# 为什么值得单独钉：修法是「把形状抬高到名字层之上」，而「退场」「留下」「孤独」
# 这类词本身是通用的 —— 一旦在问别人时也响，就会把白厄/阿格莱雅的设定
# 塞进别人的回答里，而且它看起来完全正常。

- name: 问万敌最后怎样了，不许触发阿格莱雅那条
  ask: 万敌最后怎样了
  not_injected:
    1: [aglaea-late, anaxa-people, huangdi-seen, phainon-alone, phainon-mirror]

- name: 问遐蝶后来怎么样了，同样不许
  ask: 遐蝶后来怎么样了
  not_injected:
    1: [aglaea-late, anaxa-people, huangdi-seen, phainon-alone, phainon-mirror]

- name: 泛泛问白厄是谁，仍然只给事实层
  ask: 白厄是谁
  not_injected:
    1: [phainon-alone, phainon-mirror]

- name: 泛泛说「讲讲那刻夏」，不该把「待人」那条顶上来
  ask: 讲讲那刻夏
  not_injected:
    1: [anaxa-people]

# ── 同一机制的第二批：赛飞儿一族（2026-10-10，用户重启后又聊两轮抓到的）──────
#
# 「说一说赛飞儿吧」那一轮，六条一起命中、三条被 over-limit 挡下 ——
# 和上一批是**同一个机制**。报账的价值就在这儿：不用等谁去翻代码，
# 聊两轮它自己就说出来了。
#
# 同样只动 triggers 与 priority，text 一个字没改。

- name: 问赛飞儿怎么对待后辈，给「半真半假的关照」那条
  ask: 赛飞儿怎么对待后辈
  injected:
    1: [cipher-people]

- name: 问赛飞儿的代价，给「名声和位置」那条
  ask: 赛飞儿的代价是什么
  injected:
    1: [cipher-cost]

- name: 问赛飞儿最后怎样了，给「庇护千年 / 死后化作翻飞之币」那条
  ask: 赛飞儿最后怎样了
  injected:
    1: [cipher-late]

- name: 问赛飞儿守护了什么，也给结局那条
  ask: 赛飞儿守护了什么
  injected:
    1: [cipher-late]

- name: 泛泛问赛飞儿是谁，仍然只给名字层那三条
  # 这是这一族的「反面」：形状条目不参与泛问，否则它们又会把位置占满。
  ask: 赛飞儿是谁
  not_injected:
    1: [cipher-cost, cipher-late, cipher-people]

- name: 问赛飞儿的预言，不许被代价/结局两条撞
  ask: 赛飞儿的预言是什么
  not_injected:
    1: [cipher-cost, cipher-late, cipher-people]

- name: 问万敌最后怎样了，不许带出赛飞儿的结局
  ask: 万敌最后怎样了
  not_injected:
    1: [cipher-late]

# ── 罗列型问题：名单（2026-10-10 加，起因是用户报的一个「答不全」）────────────
#
# 用户问「那就跟我讲一讲你认为的每一个黄金裔的遗憾吧」，她只给了三位。
# 查下来不是偷懒也不是取数错 —— 那一轮**根本没拿到关于遗憾的设定**：
# 命中的是 aglaea-who、amphoreus、anaxa-titan，一轮 3 条正好占满。
# 而这个问题**不可能一次答全**（一轮 3 条 × 11 位黄金裔 × 每人 6~8 条）。
#
# 真正的失效是**她不知道总共该有几位**，于是给了三个人之后全靠运气。
# 名单条目只干一件事：说清有多少人、每人有多少条、可以一位一位来。

- name: 问「每一个黄金裔」，先给名单
  ask: 那就跟我讲一讲你认为的每一个黄金裔的遗憾吧。
  injected:
    1: [goldens-roster]

- name: 追问「其他黄金裔呢」，名单仍然在
  ask: 其他黄金裔呢
  injected:
    1: [goldens-roster]

- name: 问「有哪些黄金裔」，也给名单
  ask: 有哪些黄金裔
  injected:
    1: [goldens-roster]

- name: 问具体某一个人的遗憾，不许把名单顶出来
  # 名单是「多个人」才会触发的东西。绑在单个名字上会让每一条关于某人的问题
  # 都白占一个位置 —— 那正是前面几批「挨饿条目」的病灶。
  ask: 白厄的遗憾是什么
  not_injected:
    1: [goldens-roster]

- name: 泛泛问「黄金裔是什么」，名单不该来
  ask: 黄金裔是什么
  not_injected:
    1: [goldens-roster]
