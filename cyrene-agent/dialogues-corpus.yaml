  - text: 「迷路迷境」的小妖精，是不是很可爱？当然啦，这可是「昔涟」写下的第一个故事。哆、徕、咪、发、嗦、啦、嘻，七种音符谱写出数不尽的歌谣，就像一成不变的岁月，也能创造不同以往的故事♪
