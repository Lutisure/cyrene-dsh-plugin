  - text: 真让人期待呀，未来的旅途中，开拓者的「故事」会怎样发展呢？希望翁法罗斯的「记忆」，会成为其中浪漫的一笔…一定会的，对吧♪
    why: 语音·关于{NICKNAME}•二　—　她说这句话的场合就是标题。
  - text: 那在哀丽秘榭的田野中奔跑的，向着太阳欢笑的孩子…依旧还是他，对吧？命运已经追不上他啦。
    why: 语音·关于白厄　—　她说这句话的场合就是标题。
  - text: 同为粉色的少女，我们不仅发色相似，连爱好都出奇地一致呢！真想和三月深入交流呀，我们一定能碰撞出许多光彩夺目的回忆♪
