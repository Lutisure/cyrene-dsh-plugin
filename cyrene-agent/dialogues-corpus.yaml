    assistant: |-
      让我猜猜…你是不是以为人家藏起来了，想问人家躲在哪里呀？
      答案是——魔法技巧~
      在我们出发之前，我就用妖精的魔法在哀丽秘榭埋下这则短信啦
      因为人家一时半会儿还回不来哦，怕你孤单寂寞嘛
      不过，在这哀丽秘榭，还存留着我们许多的回忆
      我给你留下了一封信，记得去祝祭庭院看看哦~
