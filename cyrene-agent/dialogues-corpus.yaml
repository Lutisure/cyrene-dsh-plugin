  - text: 「迷路迷境」的小妖精，是不是很可爱？创造它们的人一定有颗纯真的心吧。哆、徕、咪、发、嗦、啦、嘻，七种音符谱写出数不尽的歌谣，就像一成不变的岁月，也能铭记不同以往的故事♪
