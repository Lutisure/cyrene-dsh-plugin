  - text: 拥有一件阿格莱雅的定制，是所有爱美之人的梦想，我也不例外！带着盛妆出席浪漫的宴会…悄悄地，梦已经实现啦。
    why: 语音·关于阿格莱雅　—　她说这句话的场合就是标题。
  - text: 如果一千个缇宝老师都生活在奥赫玛，嘻…那一定是天堂吧！每每想到这里，就对明天更期待了呢。
    why: 语音·关于缇宝•缇安•缇宁　—　她说这句话的场合就是标题。
