  - text: 开拓者常把丹恒挂在嘴边呢。也对，有这样可靠的伙伴托举前路，我想，就是「开拓」能勇往直前的理由吧。
    why: 语音·关于丹恒•腾荒　—　她说这句话的场合就是标题。
  - text: 他的愿望，关乎翁法罗斯的大地生灵。那是一个珍贵又易碎的梦，所以才要用心呵护，对不对？
