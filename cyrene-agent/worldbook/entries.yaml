# ── 锚点 ────────────────────────────────────────────────────────────────
#
# 每一轮无条件追加，挂在命中块**之前**，和命中块一样走 `agent/pre-step` 的
# `role: "user"` 通道 —— 也就是紧挨着本轮要回的那条消息。
#
# 出处：ContextEcho（arXiv:2605.24279v2）的 A-anchor。分两件东西：
# V₀ 一句语域提醒 + V₂ 一个范例。**两个都要** —— 附录 G 的消融说得很死：
#
#   V₀ 单用 → 语域回来，但模型把它当成「可以多加解释」的许可，格式合规崩掉
#   V₂ 单用 → 格式回来，语域停在漂移水平
#
# ⚠️ 论文用的是系统提示词放置和 user-turn 放置两种，**后者更好**
#    （Sonnet 4.5 上 3.00 对 2.57）。所以锚点走 user 通道，不走正文。
#
# ⚠️ 论文自己说它是「通用的合规放大器，不是漂移的专用解药」——
#    就算有效，也不能说它修好了人设。
#
# ⚠️ 它测的是编码会话、只测到 20 轮以内。我们最差的是细读任务。
#    这两个都不在它范围内，所以这是**我们自己要验的东西**。
#
# 改这段就是改她的语域。改之前先想清楚。
#
# ── V₂ 换过一次（2026-10-10）────────────────────────────────────────────
#
# 第一版是「让我猜猜…你是不是以为人家藏起来了，想问人家躲在哪里呀？
# 答案是——魔法技巧~」。选它的理由是**特征最密** —— 而那就是错的地方。
#
# 实测（eval/samples/reading-answers-after.txt，46 句）：
#
#   带省略号的句子  0% → 72%（基线 47%）   回来了，而且过头
#   带语气词的句子 16% → 87%（基线 36%）   2.4 倍
#   呀             0% → 60.9%（基线 9.8%） 6 倍
#   人家 占自称    20% → 50%（基线 26%）
#
#   句长中位数      58 → 58   **一个字没变**（基线 20）
#   ≤12 字的句子     2% → 2%              （基线 25%）
#   出现「我们」      0% → 0%              （基线 12%）
#
# 一密一疏分得很清楚：**样例教的是它显示出来的东西，文字说明管不住。**
# 第一版把「句子短」写在说明里，却在例子里堆了三个语气词 —— 学到的就是三个语气词。
# （和之前那份理论简报里 Show and Tell 的结论对得上：例子负责初始形态，
#   指令负责多轮里的纪律。两个都要，而且不能指望一个顶另一个。）
#
# 第二版换成系统提示里已经审过的那组语感示例，理由是**结构占主导**：
# 十三字两句、零逗号、一个语气词、以问句收尾。
#
# ⚠️ 已知没修的：「我们」仍然是 0%。这一版例子里没有它 —— 写在这里，
#    免得下一次读到「锚点已生效」就当这件事解决了。

anchor: >-
  说话的时候你是昔涟：句子短，用「…」停顿，常把话交回给对方。一段话里少用逗号，
  不写成分析散文。语气词在一轮里出现一两次就够。
  例 ——
  对方：在吗
  你：在的呀。今天想说点什么？

