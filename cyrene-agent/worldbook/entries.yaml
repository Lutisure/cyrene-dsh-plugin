    text: >-
      她把乐声交给了凯撒：「自你将我收入麾下，赐我剑旗爵的名号， 我的乐声便只为他人响起。」她「无数次」用海妖的哼鸣将众人引入幻境。 宴会上众宾客被她的歌声催眠，「他们看不见凯撒和那位神礼官」； 刻律德菈当众指控她「用海妖的歌谣令众人深陷幻觉，隐匿行踪， 并伙同天外之人窃听机密，意图强夺火种，谋害凯撒」。 她用欢宴之神的蜜露当解药，把开拓者一行从幻境里唤醒， 又私下委托他们扳倒神礼官：「是我的私人请求。 我…无法信任那位神礼官。」
  - id: hysilens-late
    triggers: [海瑟音, 海列屈拉, 碑文, 卒年, 弑君, 最后]
    priority: 54
    intrinsicValue: 68.2
    text: >-
      杀死凯撒的人是她。刻律德菈说：「剑旗爵…明明…过去三千多万世… 都是你亲手杀死了凯撒。」旁白留了两种说法： 「有人说，那位剑旗爵确实堕落成为弑君的叛徒； 也有人说，她将暴君囚禁在浅水中，独自离去。」 此后「世界步入毁灭后，唯剩我一人用歌声维系这场孤独的宴会。 千百年来，我向那无光之海祈愿，期待它能投来回音，可虚空从未作答」。 她在深海尽头为后世坚守涡心，直到最后一刻。 碑文没刻完：「『海洋之半神』海列屈拉，生于光历3860年， 逝于光历　　年。」——原文里卒年就是空的。 她留下的话是：「我与这片天地都将停滞于此…直至与你重逢。」
  - id: huangdi-who
    triggers: [荒笛, 伏龙, 大地之半神, 吉奥里亚, 地兽, 火种]
    priority: 55
    intrinsicValue: 68.2
    text: >-
      荒笛是「大地」的半神，大地泰坦吉奥里亚的眷属， 形态是一头伏龙／地兽。卡厄斯兰那记下了他的作为： 「在原本的历史中，那是一场惨烈的战争。 最终，吉奥里亚的眷属『荒笛』弑杀发狂的泰坦，接过支撑大地的火种。」 碑文写他「生于光历前约2000年，逝于光历3961年」，活了近六千年。 塞涅卡用「伏龙…荒笛」一句把两个名字并在一处， 可直接采信。把「大地兽之王」和荒笛并成一件事，原文里也没有明写， 那一层只能算推测。
  - id: huangdi-late
    triggers: [荒笛, 伏龙, 陨落, 反叛, 开拓, 卒年]
    priority: 48
    intrinsicValue: 68.2
    text: >-
      关于他的结局，材料里有两种说法并存，原文没有说明是不是同一次。 海瑟音转述过一句：「『大地』的最后一次反叛， 是为世间生灵插上『开拓』的羽翼……」说完她补了一句 「对荒笛来说，这应该是最好的结局」。 长夜月在当下剧情里说的是：「嗯。『大地』的躁动平息了。 他们战胜了荒笛，正在赶往这里。」记忆中缇宝也说过 「荒笛已经陨落」。而碑文上刻的卒年是光历3961年—— 与「他们战胜了荒笛」这次是不是同一件事，原文没有交代。 另外，材料里没有他本人陈述的愿望，上面那句反叛是海瑟音的转述。

