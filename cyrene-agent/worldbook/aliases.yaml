# 别名表 —— 同一个角色的不同叫法（查询侧扩展用）
#
# ## 为什么需要它
#
# 2026-10-13 实测：「缇宝的墓碑上写了什么」这条问题，含答案的那一块写的是
# **「缇里西庇俄丝」**，而用户问的是「缇宝」——两边**一个共同专名都没有**，
# 答案块因此排到第 38 名（0.0165），输给了另一块（0.0521）。
#
# 检索是字符二元组 + 余弦：**换个叫法就等于换了个词**，余弦看不见。
#
# ## 每一组都核实过（`tools/alias-verify.mjs` / 本次 `_alias-verify.mjs`）
#
# 判据：**两种叫法都要在 986 块里真的出现过**，且指向同一个人。
#
# ## 刻意**没有**收进来的（都是核实阶段否掉的）
#
#   玻吕茜亚      只 3 块 —— 她是遐蝶的**孪生姐妹**，不是遐蝶本人
#   雅辛缇娅      5 块、37 句说话人 —— 疑似风堇的**先代**，证据不足
#   缇安 / 缇宁   各自独立的人物，只是与缇宝共用本源名「缇里西庇俄丝」
#   三月          歧义（也可能是「三月」这个月份）；只放「三月七」会漏另一向
#   猫耳小贼      只出现在 2 行，扩了也没有可命中的块
#
# ## 用法
#
# `story.mjs` 在检索前把查询里出现的名字**扩展成同组的所有叫法**，
# 再做一次余弦。原本的词保留，扩展只是加词。
#
groups:
  - [白厄, 卡厄斯兰那]
  - [万敌, 迈德漠斯]
  - [缇宝, 缇里西庇俄丝]
  - [海瑟音, 海列屈拉, 剑旗爵]
  - [那刻夏, 阿那克萨戈拉斯]
  - [赛飞儿, 赛法利娅]
  - [风堇, 雅辛忒丝]
  - [刻律德菈, 凯撒]
  - [阿格莱雅, 金织]
  - [荒笛, 伏龙]
  - [昔涟, 迷迷, 德谬歌]
  - [遐蝶, 灰黯之手]
