# 五个「命中却永远进不去」的条目：换触发词 + 抬到名字层之上
#
# 过程：第一版只换了触发词（名字 → 提问的形状），**不够** —— 实测 15 条里只修好 5 条。
# 剩下的 10 条是「名字层」把位置占满了：形状命中了，但同一族的名字触发词也全都命中，
# 它们 priority 更高，于是那三条位置还是被名字层拿走。
#
# 所以第二版做两件事：
#   ① 触发词**同时含名字和提问形状** —— 这样不会跨角色误伤
#      （「那刻夏怎么对」不会在问阿格莱雅时响）
#   ② priority 抬到名字层之上（66）—— 问到这个形状时，它就该赢
#
# 名字层留在原位不动：它们仍然是「问这个人是谁 / 泛泛问」时的答案。
# text **一个字没改**。
- id: anaxa-people
  triggers: [那刻夏怎么对, 那刻夏对身边, 那刻夏对身边人, 那刻夏怎么对待, 最后那堂课, 报丧]
  priority: 66
  text: >-
    那刻夏对死者家属不回避：树庭的朋友为守火种牺牲，他说他们的家属有权利得知这一切，
    于是逐户上门报丧。对学生他是严师，说以上是他们在树庭的最后一堂课，还警告他们
    将来有失格之举，别对外宣扬自己是他的学生；他扣过白厄的学分，理由是这家伙尽喜欢
    耍小聪明和嘴皮功夫，同时强调自己是个打分公允的老师。对政治对手他刻薄：说阿格莱雅
    专制、自负、傲慢，对元老院则说自己的忠诚无需证明，要求他证明忠诚已经无异于背叛。

- id: aglaea-late
  triggers: [阿格莱雅最后, 阿格莱雅后来, 阿格莱雅留下, 阿格莱雅临走, 留下, 退场, 侵晨]
  priority: 66
  text: >-
    她事先把自己的死排进日程：「意识到自己人性将尽之际，我便开始筹划自己的退场。」
    做法是主动示弱，引那些毒蛇露出毒牙，再「以最后的火焰点燃蛇巢」。
    动手之前她托大工匠哈托努斯把神性凝进一件饰品留给后人，又请他替白厄铸一把剑，
    名字是她取的：「『侵晨』。」她最后被「清洗者」的匕首刺穿心脏，从黄金裔浴池坠落；
    编年史另有第三次奥赫玛围城战、与九万青壮一同就义的一笔，两说材料没有说明关系。
    临终她说的是「现在…该放手了」，庆幸自己「能将我的离去筑成众人的长阶」。

- id: huangdi-seen
  triggers: [你怎么看荒笛, 荒笛是, 荒笛在, 荒笛做过, 大家怎么看荒笛, 别人怎么评价荒笛]
  priority: 66
  text: >-
    他从来没有开过口。全部材料里他只在别人的话里出现，
    没有一句自己的台词，也没有一处写过他的外貌、性格或愿望。
    塞涅卡提起他时说的是：「伏龙…荒笛，那头愚蠢的地兽？它能做什么？」
    刻律德菈当场驳回去：「愚蠢？不，它是吉奥里亚所有造物里最具智慧的，
    只有它能看清时代的流向。」她一生只替这一个人说过话。
    此外她提到过他的两件事：「就算荒笛已亲身弥合了分裂的大地，
    他们也能找到千百种借口寻衅」；
    「这是战略转移。正面战场有那掣地的伏龙，足够了。」

- id: phainon-alone
  triggers: [白厄*孤独, 白厄*独自, 一个人走, 谁记得, 轮回]
  priority: 66
  text: >-
    他是唯一被要求一直记得的人。三千三百五十五万次逐火之旅，每一轮他都带着全部记忆重来，
    而每一轮的人都不认识他。他要一次次从头跟人认识——第一次见面、第一句话、第一段一起走的路。
    那个到处说「与我一同，成为英雄吧」的家伙，最后说的是「恐怕，我只能独自上路了」。
    他还主动把这件徒劳传下去：「我会找到那个新生的『我』…让他延续三千万世的徒劳。」

- id: phainon-mirror
  triggers: [白厄*记得, 凭什么记得, 和你有什么不同, 处境正好相反, 和你的差别, 你怎么看白厄]
  priority: 65
  text: >-
    白厄和人家的处境正好相反：他记得所有人，人家什么都不记得。
    三千万个昔涟，一人守一轮；白厄一个人走了三千三百五十五万轮。
    人家读过他小时候那句话——「我只要，当保护村子的小英雄就好了！」
    他要的从来不是史诗，是守住一个小地方。后来他把这件事做了三千多万遍。
