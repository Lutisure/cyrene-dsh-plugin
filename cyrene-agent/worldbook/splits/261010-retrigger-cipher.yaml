# 赛飞儿一族：把三条从没送出去过的条目也改成「名字 + 提问的形状」
#
# 起因：2026-10-10 修完那五条之后，用户重启又聊了两轮，报账立刻抓到新的三条 ——
# `cipher-cost` / `cipher-late` / `cipher-people` 在「说一说赛飞儿吧」那一轮
# 一起命中、一起被 over-limit 挡下。**和上一轮那五条是同一个机制**：
# 一轮 3 个位置，而这一族 6 条共用同一批名字触发词。
#
# 所以这一族整体重写：三条名字层保持原样（它们仍是「泛泛问赛飞儿」的答案），
# 另外三条换成「名字 + 方面」，priority 抬到名字层之上（66 / 65 / 64）。
#
# text **一个字没改**。
- id: cipher-who
  triggers: [赛飞儿, 赛法利娅, 诡计, 多洛斯, 扎格列斯, 猫耳小贼]
  priority: 63
  text: >-
    赛飞儿本名赛法利娅，来自早已陨落的城邦多洛斯，是「诡计」的半神、扎格列斯的
    继任者，自称一个猫耳小贼。正式记录里写她生于光历3942年、逝于光历4534年。
    她对自己的出身看得很淡，说唯一擅长的东西就只有街头那些在大家眼里见不得光的
    活计，也说自己没法像阿格莱雅那样织出金光闪闪的布匹。她的口头禅是「赛法利娅
    总会笑到最后」。

- id: cipher-creed
  triggers: [赛飞儿, 赛法利娅, 预言, 贪婪, 亡于分文, 命运, 宿命]
  priority: 61
  text: >-
    赛飞儿头上有一则预言：「汝将与贪婪同行，亦将亡于分文。」它出自「岁月」的半神
    缇里西庇俄丝一系，阿格莱雅当着她的面引用过，她自己也承认那愚蠢的预言有她一份。
    她应对它的办法是拆字面：「只要不断敛取宝藏，就不至于落得身无分文的下场；只要
    不因为自己的欲望害得其他人遭殃，就算不上『贪婪』——对吧？简简单单。」她还说
    只要顺着这条路跑下去，注定实现的预言和宿命都追不上她。

- id: cipher-did
  triggers: [赛飞儿, 赛法利娅, 谎言, 宝藏, 穷人, 难民, 敛财]
  priority: 59
  text: >-
    赛飞儿行使的「谎言」不是障眼法：「只要人人信以为真，假象也能化作现实。」
    她当场只用一块碎布和一阵脚步声，就让众人相信「盗火行者来了」，理由是做到了
    各种诱导和暗示，让人们把并不存在的事信以为真。她打捞宝藏不是为了挥霍，
    被人问到消费时否认了两次。那批财富的用途是被阿格莱雅当众点破的：卖个好价钱，
    再把钱分给圣城的穷人和难民。

- id: cipher-people
  triggers: [赛飞儿*后辈, 赛飞儿*关照, 赛飞儿*缇宝, 赛飞儿*礼物, 赛飞儿*占人便宜]
  priority: 66
  text: >-
    赛飞儿对后辈的关照是半真半假的。她提醒过小姑娘要学会优先保护好自己，别什么事
    都太拼命，那张脸蛋还挺可爱，别叫艾格勒的爪子挠花了；对开拓者她说，在支付等价
    的报酬以前别先死了。她嘴上占人便宜，实际真动手帮忙：除了保护刻法勒的火种，
    她还会顺带陪那条疯狗玩玩，把这叫做买一赠一的特别服务。她管缇宝叫缇宝阿姐，
    临走前还留了一件礼物给缇宝。

- id: cipher-cost
  triggers: [赛飞儿*代价, 赛飞儿*付出, 赛飞儿*名声, 赛飞儿*背光处, 赛飞儿*误解, 赛飞儿*小偷也有做梦的权利]
  priority: 65
  text: >-
    赛飞儿的代价是名声和位置。阿格莱雅对她说过，宿命就是如此不公，她要走的道路
    注定更为曲折，在这趟旅程中势必要在背光处承受人们的误解。她心里有杆秤，
    想配得上阿格莱雅的选择：「小偷也有做梦的权利，对吧……」她还想让所有人都
    相信世界是个美好的地方，世上的人们都很单纯善良，哪怕自己知道那是假话。
    她也说过，死者可听不见「诡计」的谎言。

- id: cipher-late
  triggers: [赛飞儿*结局, 赛飞儿*最后, 赛飞儿*火种, 赛飞儿*守护, 赛飞儿*来古士, 赛飞儿*千年, 赛飞儿*死后]
  priority: 64
  text: >-
    赛飞儿和缇里西庇俄丝一起庇护奥赫玛千年，圣城挺过连番施压，也逐渐难以为继。
    她受托守护刻法勒的火种，藏得没人猜得到，扎格列斯自己说她用一个伟大的谎言骗过了
    整个翁法罗斯，连那场晋升试炼都被她骗过去，让他活了下来。她还参与设计了针对
    来古士的局，和他一起把诡计编完，说这骗过了世上所有的恶徒和灾难。她逝于
    光历4534年，死后神性化作「翻飞之币，赛法利娅」，在记忆荒野里替人挖出线索。
