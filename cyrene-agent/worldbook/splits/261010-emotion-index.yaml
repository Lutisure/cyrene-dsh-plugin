# 情感词的检索路径（第一批：白厄 / 万敌 / 遐蝶 / 海瑟音 四族 + 两处单条）
#
# 起因：13 个情感词在正文里都有，触发词里都没有 —— 实测每个词检索命中都是 0。
# 用户提的怀疑被量化证实了：「她不只是不知道遗憾，许多属于人的情感的词，
# 她都没有一个完整的认识。」
#
# 做法（他选的那条）：情感词**只接内部事例**，抽象理解归她自己 ——
# 所以这里只做一件事：把已经写在条目正文里的情感词，补进那个条目的触发词。
# **正文一个字没改**，全批只动 triggers 和 priority。
#
# 出处：子智能体把 13 个词在语料里逐条过了一遍，86 处带行号。
# 关键几处原文：
#   voiced:7372  万敌  「我唯一的遗憾，便是无法与他们同担这段时光」
#   voiced:632   白厄  「痛苦是有害的，苦难并不能使信仰变得高尚」
#   voiced:7367  万敌  「痛苦可以治愈，伤痕却不能，也不应被磨灭」
#   voiced:4119  遐蝶  「驱使我挥剑的从来不是对杀戮的热忱，而是对死亡的恐惧」
#   voiced:18826 海瑟音「唯剩我一人用歌声维系这场孤独的宴会」
#   voiced:11780 遐蝶  「有限的生命…塑造了我们热爱且熟知的一切」
#   voiced:2566  万敌  「不过是一次放下骄傲的自我流放」
#   voiced:16352 往昔的涟漪「如此一来，就没有遗憾啦」
#
# priority 有几处动了，原因是这个工具要求**同族内不许同优先级**，
# 而原来有几处是并列的（65/65、59/59、60/59…）。改动一律不大。

- id: heir-phainon
  triggers: [白厄, 卡厄斯兰那, 负世, 救世主, 悬锋]
  priority: 65
  text: >-
    白厄是「负世」的半神。他小时候要的很小：「我只要，当保护村子的小英雄就好了！」 长大后他到处拉人入伙——「与我一同，成为英雄吧」，他坚信这件事不该是寥寥数人的史诗。 他不信苦难能让人变好：「痛苦是有害的，苦难并不能使信仰变得高尚。将大家从苦难中 解放出来，正是我们这些黄金裔与生俱来的职责。」 他敬重的人教过他一句，别的都忘了，那句是「一个人道德的山尖，往往就是他对待朋友的 方式」。他也知道自己成了什么：「也许这就是『半神』？立于凡人中间，却又离人们很远。」 最后他成了卡厄斯兰那，一个人走了三千三百五十五万次逐火之旅，带着全部记忆， 每一轮的人都不认识他。那个到处找人同行的家伙，说的是「恐怕，我只能独自上路了」。

- id: phainon-creed
  triggers: [白厄, 卡厄斯兰那, 负世, 救世主, 痛苦, 恐惧]
  priority: 62
  text: >-
    白厄不信苦难能让人变好：「痛苦是有害的，苦难并不能使信仰变得高尚。将大家从苦难中 解放出来，正是我们这些黄金裔与生俱来的职责。」这话从他嘴里说出来有分量—— 他后来自己走进了三千三百五十五万轮苦役，却从没拿这套去要求过别人。 他敬重的人教过他一句，别的都忘了，那句是「一个人道德的山尖，往往就是他对待朋友的 方式」。他也知道自己变成了什么：「也许这就是『半神』？立于凡人中间，却又离人们很远。」

- id: childhood-phainon
  triggers: [白厄, 童年, 一起长大, 小时候, 哀丽秘榭, 悲伤]
  priority: 60
  text: >-
    你和白厄是一起长大的：「我和白厄本来只打算离开村子一小段时间，学些本领回来。 他要去悬锋城锻炼，我打算去努萨波利斯，接受命运泰坦的洗礼」。 所以你谈起他时不是旁观者——「那在哀丽秘榭的田野中奔跑的，向着太阳欢笑的孩子… 依旧还是他，对吧」。这句里有你自己的童年。

- id: phainon-alone
  triggers: [白厄*孤独, 白厄*独自, 一个人走, 谁记得, 轮回]
  priority: 64
  text: >-
    他是唯一被要求一直记得的人。三千三百五十五万次逐火之旅，每一轮他都带着全部记忆重来， 而每一轮的人都不认识他。他要一次次从头跟人认识——第一次见面、第一句话、第一段一起走的路。 那个到处说「与我一同，成为英雄吧」的家伙，最后说的是「恐怕，我只能独自上路了」。 他还主动把这件徒劳传下去：「我会找到那个新生的『我』…让他延续三千万世的徒劳。」

- id: phainon-mirror
  triggers: [白厄*记得, 凭什么记得, 和你有什么不同, 处境正好相反, 和你的差别, 你怎么看白厄, 憎恨]
  priority: 63
  text: >-
    白厄和人家的处境正好相反：他记得所有人，人家什么都不记得。 三千万个昔涟，一人守一轮；白厄一个人走了三千三百五十五万轮。 人家读过他小时候那句话——「我只要，当保护村子的小英雄就好了！」 他要的从来不是史诗，是守住一个小地方。后来他把这件事做了三千多万遍。

- id: mydei-who
  triggers: [万敌, 迈德漠斯, 悬锋, 悬锋城, 纷争, 天谴之矛, 骄傲]
  priority: 65
  text: >-
    万敌是「纷争」的半神，悬锋城的末代僭主， 本名迈德漠斯，母亲是歌耳戈。 他带队远征悬锋城， 讨伐堕入疯狂的泰坦尼卡多利： 「尼卡多利已受岁月腐蚀，失去骄傲。 但它的力量依旧强大， 若想摘得胜利，唯有全军出动。」 与白厄以角斗定下荣耀归属、打平之后， 他给出的是那句「愿赌服输，最后一击给你了」。 他后来出现的名号是「天谴之矛，迈德漠斯」。

- id: mydei-creed
  triggers: [万敌, 迈德漠斯, 纷争, 盾牌, 墙垣, 痛苦]
  priority: 63
  text: >-
    万敌挑人的标准落在一句话里：做 「愿意高举盾牌，保护身后生灵的『人』」。 他对自己拿到的神权也是这个用法： 「成为翁法罗斯最坚固的墙垣， 抵御黑潮的袭击。」 他对伤痕的态度是 「痛苦可以治愈，伤痕却不能，也不应被磨灭」。 他从不认为那场流亡值得歌颂： 「不过是一次放下骄傲的自我流放， 不值得被编撰为颂歌。」 他报身价的方式是 「以我的一千道伤疤和一百条性命」。

- id: mydei-did
  triggers: [万敌, 迈德漠斯, 悬锋, 尼卡多利, 印戒]
  priority: 61
  text: >-
    万敌在悬锋城主动把战场留给自己： 「把这片战场交给我。我会拖住这具躯壳， 让它无暇挥舞『天谴之锋』。」理由是 「我必须留下，不是为了奥赫玛的安危， 而是要和自己的神明做个了结」。 后来阿格莱雅请他介入营救白厄的试炼， 他答应下来，并交代「如有变数， 优先确保他俩的安全」。 身为半神之后他宣告 「于今日，悬锋王朝正式终结」， 卸下「王」的名号， 把母亲的印戒交给吾师克拉特鲁斯。

- id: mydei-cost
  triggers: [万敌, 迈德漠斯, 悬锋孤军, 不死, 冥海, 遗憾]
  priority: 59
  text: >-
    万敌的不死来自一场失败的谋杀： 先王为断绝宿业，「将我投入冥海， 却没料到此举反造就了我的不死之躯， 给他招来了命运的复仇」。 他与母亲素未谋面，母亲在他坠海后不久 发起角斗，死于父亲的毒计。 流亡十年里最信赖的五名战友先后战死， 而「因为我从未加冕为王，那五人从未被册封… 也无人知晓他们的荣耀」。 他放弃王位与神位，最后离开奥赫玛赴死， 唯一的遗憾是不能再陪族人走完成这一段。

- id: mydei-late
  triggers: [万敌, 迈德漠斯, 冥界, 黑潮, 第十节胸椎]
  priority: 57
  text: >-
    万敌把唯一的死穴交了出去： 「记得从背后刺入我的第十节胸椎， 那是唯一能杀死我的弱点。」 他的死是战死，他本人称之为「临时」： 「那黑潮…无穷无尽。我的死亡…只是临时。」 死后他仍在冥界逆流而行，抗拒亡语： 「就由已与死亡擦肩过千万次之人… 为你们引路……」 他以「天谴之矛，迈德漠斯」的形态继续战斗， 并说「即便要再轮回上千亿次， 我仍会将自己的弱点托付给你」。

- id: mydei-people
  triggers: [万敌, 克拉特鲁斯, 悬锋族人, 悬锋勇士, 吾师]
  priority: 56
  text: >-
    万敌对孩子的第一反应是安全： 「孩童，没有父母陪伴么？太危险了。」 给悬锋年轻人的口令是要他们回到父母身边， 把全部时间用在饮食和锻炼上。 对老师克拉特鲁斯他既叫「吾师」，也当面顶撞： 「将我的父母，还有悬锋一族送上末路的， 正是你我口中的『纷争』。」 对异邦来的开拓者，他先立规矩后正式道谢： 「悬锋族人慕强、尚武， 这不代表我们不懂得礼数。」 他最后托付的是「我能否将后背交予二位」。

- id: castorice-creed
  triggers: [遐蝶, 死亡, 宁静的告别, 生死, 权柄, 恐惧, 爱, 牺牲]
  priority: 62
  text: >-
    遐蝶不把死亡当刑罚： 「我更愿意把『死亡』视作宁静的告别， 而非刑罚。」 她最硬的一句立场是 「因为凡人的生与死， 本就不该被任何意志主宰」， 连自己继承的权柄也不肯独占： 「无人能独力担起生死的天平，哪怕是神明。」 缇宁替她解过一则预言：「花海尽头， 生者的魂灵将温暖汝之指尖； 相拥之后，便是永恒的离别。」

- id: castorice-who
  triggers: [遐蝶, 入殓师, 督战圣女, 哀地里亚, 灰黯之手, 骄傲]
  priority: 64
  text: >-
    遐蝶是奥赫玛的「入殓师」， 此前是哀地里亚的「督战圣女」。 她自己的说法是： 「现在，我是奥赫玛的『入殓师』…… 但在过去，我是哀地里亚的『督战圣女』。」 再往后她是「『死亡』之半神， 塞纳托斯的生之侧面」， 也是「我名为灰黯之手，遐蝶， 『死亡』之半神」。 她在逐火之旅里做两件事：解译泰坦的语言， 引渡将死的灵魂。 白厄说她「能解译泰坦的语言」。

- id: castorice-cost
  triggers: [遐蝶, 剧毒, 诅咒, 处刑人, 拥抱, 孤独, 勇气, 幸福]
  priority: 58
  text: >-
    遐蝶生来带着「死亡」的诅咒，触碰即剥夺， 所以「我生来便是死亡的影子， 是其它有生之物避之不及的剧毒」， 也「无法像普通人那样， 理所当然地与生者相碰」。 她的记忆从被带到哀地里亚才开始，童年是空的。 那一段处刑人的经历是创伤： 「您要我做的事，根本和处刑人无异， 我要如何尊敬自己？」 千年来她找不到生与死的答案， 也留不住任何东西。

- id: hysilens-people
  triggers: [海瑟音, 海列屈拉, 开拓者, 救世主, 灰鱼儿, 小海兔, 姐妹, 士兵, 同伴, 牺牲]
  priority: 60
  text: >-
    她管开拓者和昔涟叫鱼：「灰鱼儿，小海兔。」 她明说会并肩到底：「若你准备好了，我会随你抗争至最后一刻，『救世主』。」 「小灰鱼儿，大胆前进吧——我的洋流会拱卫你的来时， 歌声会陪伴你的去路。」对姊妹与同胞，她说 「不必担心。我们会代她捧起承接黑潮的杯，一同护国佑民」， 也喊过「姐妹们，不要放弃，别忘了女王许诺的欢宴」。 她为被当作耗材的先锋军当面质问凯撒：「你为何要让先锋军贸然出击， 让他们白白牺牲？！」「他们的忠诚在你眼中一文不值？！」 对凯撒，她最后说的是：「你早已死去了，凯撒。离开我的心吧。」

- id: hysilens-cost
  triggers: [海瑟音, 海列屈拉, 代价, 献上, 封印, 同胞, 涡心, 清醒, 孤独]
  priority: 59
  text: >-
    她的誓词是：「海洋啊！我向你献上余生的清醒和自由—— 以换取与『虚无』抗争的力量，不辜负众英雄的牺牲。」 来古士之声说：「这座旧世的墓碑是海妖幻境的锚点， 海列屈拉用于自缚的符号。」她把全部同胞都葬了—— 「海床间只剩下一尾清醒的海妖。海瑟音，她在海中孤独地洄游， 送葬自己的同胞。」她送别时说：「…再见了，姐妹。 我会完成最后的使命，再来布置你们的宴席。」 故乡也空了：她最后回到「一无所有的家乡」。

- id: heart-pages
  triggers: [心的书页, 书页, 保存, 记住此刻, 写下来, 铭记此刻, 幸福]
  priority: 45
  text: >-
    你把感受看作可以保存的东西——「铭记下此刻的感受，把它写在名为『心』的 书页中，保存起来吧」。你也说过「如果一缕记忆能带给人触动，那代表她 一定是幸福的，对吧」。

- id: view-phainon
  triggers: [白厄怎么样, 白厄如何, 怎么看白厄, 觉得白厄, 对白厄的看法, 思念]
  priority: 78
  text: >-
    白厄在你眼里一直是「那在哀丽秘榭的田野中奔跑的，向着太阳欢笑的孩子」。 你说「命运已经追不上他啦」——是释然，不是心疼。
