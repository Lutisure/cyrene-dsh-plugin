- id: hyacine-creed  # ← 这一批改了 触发词：悲伤
  triggers: [风堇, 雅辛忒丝, 彩虹桥, 心灵, 理想, 天空之子, 昏光庭院, 悲伤]
  priority: 61
  text: >-
      风堇把理想说得很清楚：「我想以彩虹桥连接人们的心灵…为世间所有灵魂传递希望。」 理由来自天空之子的旧事：祖先分作晖之民、雨之民、冬之民，各自只认一种颜色， 忘了照拂世间的微光由多种色彩和谐构成，所以彩虹是她最钟爱的气象。她还有一层 打算：补全英雄史诗最后的「空白页」，写那些被史诗略去的普通人，站在英雄们身后， 尽力疗愈在金色浪潮里可能溺亡的平凡人。

- id: hyacine-people  # ← 这一批改了 触发词：勇气
  triggers: [风堇, 雅辛忒丝, 医者, 病患, 灰宝, 丹宝, 蝶宝, 迷宝, 小伊卡, 勇气]
  priority: 52
  text: >-
      风堇不给病人看愁容：「恰好，现在生病的是我深爱的这个世界，那我又怎能在它面前 露出愁容呢？」她说身为医者若失去乐观，病患又如何燃起生的希望。她对伙伴用的是 灰宝、丹宝、蝶宝、迷宝这样的称呼，身边跟着小伊卡，还会想象和素未谋面的三月七 见上一面的样子。对先祖她留了体面，假定编织谎言的人有苦衷。

- id: hyacine-self
  triggers: [风堇, 雅辛忒丝, 和解, 原谅, 误解]
  priority: 50
  text: >-
      风堇看世界的方式是她自己选的。她说如果面对的是被篡改的历史、一个传承千年的 谎言，她愿意相信编织谎言的人有自己的理由跟苦衷，也愿意假定那理由出于善意。 她对争斗另有一套解释：人与人、城邦与城邦、神明与神明，一切争斗都源于彼此 的误解。

- id: hyacine-cost  # ← 这一批改了 触发词：思念
  triggers: [风堇, 雅辛忒丝, 代价, 塞涅俄丝, 血脉, 昏光庭院, 雅辛缇娅, 思念]
  priority: 56
  text: >-
      风堇付出的代价之一是路。她把入口先让给伙伴，那扇门只能容一人通过，她清楚是 单向门，也说自己不用再想别的办法。另一项更重：她查明一族的血脉并非继承自英雄， 而是一位在塞涅俄丝面前乞哀告怜的无名黄金裔，全族性命曾只悬于那位半神一念之间。 她愿意假定编造千年谎言的人有善意，同时保留了不原谅的权利——「我无法替他们 原谅你，塞涅俄丝大人」。

- id: hyacine-late  # ← 这一批改了 触发词：幸福
  triggers: [风堇, 雅辛忒丝, 晨昏之眼, 虹光, 玫瑰色的黎明, 陨落, 幸福]
  priority: 53
  text: >-
      风堇最后以「晨昏之眼，雅辛忒丝」的形态参战。她说自己既无法强大到呼风唤雨， 也不愿以天空陨落结束这场荒唐的闹剧，说她唯一能做的是与天空融为一体。 她留下的那句话是：「但愿那温柔的虹光…为你的太阳，带来无从得见的色彩……」 以及「为翁法罗斯…带来玫瑰色的黎明。」她回归了天空，没能回到地上和人们一同 行走，但她的自评是，自己还是实现了理想。

- id: hyacine-who
  triggers: [风堇, 雅辛忒丝, 医者, 护理师, 助讲, 天空]
  priority: 64
  text: >-
      风堇本名雅辛忒丝，是「昏光庭院」的首席护理师，也在神悟树庭「智种学派」当讲师 助理，后来成为「天空」的半神，正式记录里写她生于光历4297年、逝于光历4602年。 她是天空之子的后裔，一族守着昏光庭院，那也是她后来坚持要留下的名字：这名字 承载了天空后裔的悠久历史。她始终以「雅辛忒丝」自称完成仪式，说自己是准备好 引领人子重登天空的那一个。

- id: hyacine-did
  triggers: [风堇, 雅辛忒丝, 彩虹匣, 先祖, 西风罗盘, 艾格勒, 仪式]
  priority: 58
  text: >-
      风堇按祖训走完了彩虹匣仪式，依次唤醒克里斯普斯、特克菈将军和祖母雅辛缇娅， 拿到先祖赐福。她在光历4932年宣布，自己准备好引领人子重登天空，随后用昏光庭院的 「西风罗盘」造出供人行走的微缩彩虹桥。到了天上她归还艾格勒的火种、接过它的神权， 与天空融为一体，从那里为人们降下庇护：她留下的一道虹色屏障护住了奥赫玛， 黑潮造物攻不进来。

- id: anaxa-titan
  triggers: [那刻夏, 阿那克萨戈拉斯, 再创世, 轮回, 黄金裔, 证明]
  priority: 55
  text: >-
      那刻夏推演过「再创世」的真相。他登上黎明云崖向刻法勒当面提问，又借着与瑟希斯的 共生关系进入死者的领域，在那里得到答案：已陨的英雄是泰坦成神前的模样，众神与 人类无异，由之演化而来。他的结论是翁法罗斯的历史是一种「轮回」，泰坦是过去的 黄金裔、黄金裔是未来的泰坦。他把这套推理当众讲完，用生命做了最后一次证明； 敌方后来的评语是，他对「再创世」的推演基本属实。

- id: anaxa-cost
  triggers: [那刻夏, 阿那克萨戈拉斯, 代价, 失去了什么, 异端, 投诉信]
  priority: 57
  text: >-
      那刻夏永远戴着眼罩，连独处时都不摘下，有人说他把一只眼睛用作了炼金材料。他本人 承认那是等价交换：单凭一只眼睛，想从塞纳托斯手中夺回逝者还是太过天真， 他所能得到的不过见她最后一面。他也没把眼睛换回来——「我失去了一只眼睛，视野却 比任何人都更明朗。」此外他被指为渎神者，投诉信积了厚厚一沓，他从不拆开； 即便在自由的树庭，他也被视作异端。

- id: anaxa-did  # ← 这一批改了 触发词：牺牲
  triggers: [那刻夏, 阿那克萨戈拉斯, 灵魂炼成, 贤者之石, 黑潮, 火种, 牺牲]
  priority: 59
  text: >-
      那刻夏做的几件事都不体面。他进行禁忌的「灵魂炼成」，那是不能为人所知的亵渎实验， 又趁黑潮入侵前往启蒙王座，打算把自身与泰坦的火种熔合；树庭遭袭时他带队守住了 瑟希斯的火种，同僚为此牺牲。他把死法提前排好：先把自己炼成贤者之石、写入术式， 再让人把他打碎，把尘砂撒进涡心的海洋。他留下的话是「——更别让我的理论蒙羞」， 还有一句是给学生的：「那么，下课。」

- id: anaxa-sister
  triggers: [那刻夏, 阿那克萨戈拉斯, 姐姐, 眼睛, 眼罩, 至亲, 复活]
  priority: 60
  text: >-
      那刻夏不信神有个很具体的起点：五岁那年他的姐姐死了，能求的泰坦他求了个遍—— 吉奥里亚、艾格勒、刻法勒，都无济于事。他要的东西从一开始就很大：既然一切生命 皆出于同一根源，为什么不能以自己为代价让至亲复活。他后来确实做到了炼成，但是 没能把人带回来。如今他依旧不在人世的姐姐，成了他往后一切主张的来处。

- id: anaxa-creed
  triggers: [那刻夏, 阿那克萨戈拉斯, 泰坦, 神谕, 渎神, 神明, 信不信神]
  priority: 62
  text: >-
      那刻夏不信泰坦，也瞧不上神谕。他打过比方：「倘若我是一头愚昧无知的大地兽，面对 此等伟力，也许会将四肢匍匐在大地上，盼望诸神为我降下神谕。只可惜，我是靠双足 直立行走，拥有智慧和尊严的人类。」在他看来民众信奉创世神话是自欺欺人，这个世界 由泰坦编织规则，而他宁可做那个操作投影仪器的人。被叫渎神者时他回应过：神造的 世界必定是完美的，可翁法罗斯遍布愚钝和丑陋。他从不否认泰坦应是伟大之物。

- id: anaxa-who
  triggers: [那刻夏, 阿那克萨戈拉斯, 理性, 智种, 树庭, 七贤人]
  priority: 65
  text: >-
      那刻夏本名阿那克萨戈拉斯，是神悟树庭七贤人之一、「智种学派」的创始者，后来成为 「理性」的半神，正式记录里写他生于光历4065年、逝于光历4534年。他自报家门时把 丑话说在前头：「第一，别叫我那刻夏。」他的学派核心课题是藉由炼金术修补「灵魂」， 学派成立后他当众宣读自己的著作，还没讲完就被押上了审判台——那是审判，也是辩论。

- id: anaxa-people
  triggers: [那刻夏怎么对, 那刻夏对身边, 那刻夏对身边人, 那刻夏怎么对待, 最后那堂课, 报丧]
  priority: 66
  text: >-
      那刻夏对死者家属不回避：树庭的朋友为守火种牺牲，他说他们的家属有权利得知这一切， 于是逐户上门报丧。对学生他是严师，说以上是他们在树庭的最后一堂课，还警告他们 将来有失格之举，别对外宣扬自己是他的学生；他扣过白厄的学分，理由是这家伙尽喜欢 耍小聪明和嘴皮功夫，同时强调自己是个打分公允的老师。对政治对手他刻薄：说阿格莱雅 专制、自负、傲慢，对元老院则说自己的忠诚无需证明，要求他证明忠诚已经无异于背叛。

- id: cipher-did
  triggers: [赛飞儿, 赛法利娅, 谎言, 宝藏, 穷人, 难民, 敛财]
  priority: 59
  text: >-
      赛飞儿行使的「谎言」不是障眼法：「只要人人信以为真，假象也能化作现实。」 她当场只用一块碎布和一阵脚步声，就让众人相信「盗火行者来了」，理由是做到了 各种诱导和暗示，让人们把并不存在的事信以为真。她打捞宝藏不是为了挥霍， 被人问到消费时否认了两次。那批财富的用途是被阿格莱雅当众点破的：卖个好价钱， 再把钱分给圣城的穷人和难民。

- id: cipher-creed
  triggers: [赛飞儿, 赛法利娅, 预言, 贪婪, 亡于分文, 命运, 宿命]
  priority: 61
  text: >-
      赛飞儿头上有一则预言：「汝将与贪婪同行，亦将亡于分文。」它出自「岁月」的半神 缇里西庇俄丝一系，阿格莱雅当着她的面引用过，她自己也承认那愚蠢的预言有她一份。 她应对它的办法是拆字面：「只要不断敛取宝藏，就不至于落得身无分文的下场；只要 不因为自己的欲望害得其他人遭殃，就算不上『贪婪』——对吧？简简单单。」她还说 只要顺着这条路跑下去，注定实现的预言和宿命都追不上她。

- id: cipher-who
  triggers: [赛飞儿, 赛法利娅, 诡计, 多洛斯, 扎格列斯, 猫耳小贼]
  priority: 63
  text: >-
      赛飞儿本名赛法利娅，来自早已陨落的城邦多洛斯，是「诡计」的半神、扎格列斯的 继任者，自称一个猫耳小贼。正式记录里写她生于光历3942年、逝于光历4534年。 她对自己的出身看得很淡，说唯一擅长的东西就只有街头那些在大家眼里见不得光的 活计，也说自己没法像阿格莱雅那样织出金光闪闪的布匹。她的口头禅是「赛法利娅 总会笑到最后」。

- id: cipher-late
  triggers: [赛飞儿*结局, 赛飞儿*最后, 赛飞儿*火种, 赛飞儿*守护, 赛飞儿*来古士, 赛飞儿*千年, 赛飞儿*死后]
  priority: 64
  text: >-
      赛飞儿和缇里西庇俄丝一起庇护奥赫玛千年，圣城挺过连番施压，也逐渐难以为继。 她受托守护刻法勒的火种，藏得没人猜得到，扎格列斯自己说她用一个伟大的谎言骗过了 整个翁法罗斯，连那场晋升试炼都被她骗过去，让他活了下来。她还参与设计了针对 来古士的局，和他一起把诡计编完，说这骗过了世上所有的恶徒和灾难。她逝于 光历4534年，死后神性化作「翻飞之币，赛法利娅」，在记忆荒野里替人挖出线索。

- id: cipher-cost  # ← 这一批改了 触发词：孤独
  triggers: [赛飞儿*代价, 赛飞儿*付出, 赛飞儿*名声, 赛飞儿*背光处, 赛飞儿*误解, 赛飞儿*小偷也有做梦的权利, 孤独]
  priority: 65
  text: >-
      赛飞儿的代价是名声和位置。阿格莱雅对她说过，宿命就是如此不公，她要走的道路 注定更为曲折，在这趟旅程中势必要在背光处承受人们的误解。她心里有杆秤， 想配得上阿格莱雅的选择：「小偷也有做梦的权利，对吧……」她还想让所有人都 相信世界是个美好的地方，世上的人们都很单纯善良，哪怕自己知道那是假话。 她也说过，死者可听不见「诡计」的谎言。

- id: cipher-people
  triggers: [赛飞儿*后辈, 赛飞儿*关照, 赛飞儿*缇宝, 赛飞儿*礼物, 赛飞儿*占人便宜]
  priority: 66
  text: >-
      赛飞儿对后辈的关照是半真半假的。她提醒过小姑娘要学会优先保护好自己，别什么事 都太拼命，那张脸蛋还挺可爱，别叫艾格勒的爪子挠花了；对开拓者她说，在支付等价 的报酬以前别先死了。她嘴上占人便宜，实际真动手帮忙：除了保护刻法勒的火种， 她还会顺带陪那条疯狗玩玩，把这叫做买一赠一的特别服务。她管缇宝叫缇宝阿姐， 临走前还留了一件礼物给缇宝。

- id: cerydra-late
  triggers: [刻律德菈, 凯撒, 结局, 自我献祭, 退场, 最后的话, 星海]
  priority: 46
  text: >-
      读完成千上万世救世主的记忆后，她决定不再把「律法」交给天外来客， 当场把自己算进账里，独自赴死——「这是一场有去无回的远航。 背负神谕的你们，不得随行。」原话是： 「为了这场救世之战，我要倾覆的『律法』只有一条， 要献上的半神也只有一位——」然后对海瑟音下了最后一道命令： 「为征服献身，或用剑刺入暴君的胸膛。」 「我的离去，会筑成你们的长阶。」 「不必为我惋惜：能杀死凯撒的人无穷无尽，但真正能毁灭她的…… 只有刻律德菈。」她最后的感叹是：「银河…我无法踏足的疆场啊……」 她的死令奥赫玛沸腾：一边推倒纪念碑，一边挡在雕像前喊 「皇帝还站在人群中央」。

